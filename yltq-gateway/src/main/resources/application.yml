server:
  port: 8081

spring:
  application:
    name: gateway

services:
  admin:
    url: ${ADMIN_SERVICE_URL:http://localhost:8080}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8088}

security:
  jwt:
    issuer: ${SECURITY_ISSUER_URI}
    jwk-set-uri: ${SECURITY_JWKS_URI}
    audience: ${SECURITY_AUDIENCE}
    roles-claim: ${SECURITY_ROLES_CLAIM:roles}
  roles:
    upload: ${SECURITY_UPLOAD_ROLE:ADMIN_UPLOAD}
    payment-delete: ${SECURITY_PAYMENT_DELETE_ROLE:PAYMENT_DELETE}
